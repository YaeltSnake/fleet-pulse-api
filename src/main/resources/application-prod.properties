# Production overrides — activated by spring.profiles.active=prod
# Non-sensitive defaults shown here. Secrets must come from environment variables.

# BCrypt cost factor — VALIDATED Phase 6 L3
# SecurityConfig: new BCryptPasswordEncoder() defaults to strength 10
# AuthService.DUMMY_HASH = $2a$10$... — cost factor 10 matches
# Both stay at 10: acceptable for current load (5 units, few admins).
# Raise to 12 before multi-tenant or public-facing user base (Phase 8+).
app.bcrypt.cost-factor-confirmed=10
